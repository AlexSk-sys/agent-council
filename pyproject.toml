[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-council"
version = "0.1.0"
description = "Run a task through Claude Code, DeepSeek Harness and OpenCode, then make them review each other"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
council = "council.cli:main"

[tool.setuptools.packages.find]
include = ["council*"]
